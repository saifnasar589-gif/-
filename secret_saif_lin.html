<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>سر صغير بين سيف ولين 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff0fb;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at top,#35235f 0,#11142f 48%,#080a19 100%);overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#f7a8ff 1px,transparent 1.5px);background-size:57px 57px,91px 91px;background-position:0 0,24px 33px;opacity:.35}.wrap{position:relative;max-width:760px;margin:auto;padding:28px 16px 48px}.hero{text-align:center;padding:32px 12px 24px}.moon{font-size:54px;filter:drop-shadow(0 0 18px #f6aaff)}h1{font-size:clamp(28px,7vw,44px);margin:12px 0;color:#ffb9ef;text-shadow:0 0 20px #d24dca}p{line-height:1.9}.sub{font-size:17px;color:#e4d6ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:1px solid #d76bdd;background:linear-gradient(145deg,#211b46,#17142d);color:#fff;border-radius:18px;padding:18px 10px;min-height:112px;font-size:17px;cursor:pointer;box-shadow:0 0 18px #a2388830;transition:.2s}.choice:active{transform:scale(.97)}.emoji{display:block;font-size:28px;margin-bottom:8px}.reveal{display:none;margin-top:18px;padding:22px 18px;border:1px solid #ff9ee9;border-radius:20px;background:#19142feF;box-shadow:0 0 28px #b14da344;text-align:center;font-size:18px;line-height:2}.reveal.show{display:block;animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.final{margin-top:24px;text-align:center;border-top:1px solid #764d89;padding:24px 10px 0}.small{font-size:13px;color:#c7b8e8}.heart{color:#ff8edb}.reset{margin-top:14px;border:1px solid #b86ac7;color:#ffeaff;background:transparent;border-radius:99px;padding:10px 18px;cursor:pointer}@media(max-width:440px){.grid{grid-template-columns:1fr}.choice{min-height:84px}.hero{padding-top:18px}}
</style></head><body><div class="stars"></div><main class="wrap"><header class="hero"><div class="moon">🌙✨</div><h1>سر صغير بين سيف ولين</h1><p class="sub">عندي لج مفاجأة صغيرة يا بسبوستي<br>اختاري قلب واكتشفي شنو مخبّي إلج سيف 💗</p></header>
<section class="grid" aria-label="اختاري مفاجأة">
<button class="choice" onclick="reveal(0)"><span class="emoji">🌙</span>تحت نفس القمر</button>
<button class="choice" onclick="reveal(1)"><span class="emoji">💌</span>رسالة من قلبي</button>
<button class="choice" onclick="reveal(2)"><span class="emoji">🎧</span>دلع بصوتج</button>
<button class="choice" onclick="reveal(3)"><span class="emoji">🫶</span>أمنية إلنا</button>
<button class="choice" onclick="reveal(4)"><span class="emoji">🙈</span>تحدي دلع</button>
<button class="choice" onclick="reveal(5)"><span class="emoji">💖</span>المفاجأة الأخيرة</button>
</section><section id="reveal" class="reveal" aria-live="polite"></section>
<footer class="final"><p>يمكن ما أگدر أجيب لج الدنيا كلها<br>بس أگدر كل يوم أحاول أخليج تحسين شكد إنتِ غالية بقلبي</p><p class="heart">أحبج يا لين، يا أحلى صدفة صارت بحياتي 💗</p><p>— سيف ♡</p><p class="small">كل قلب بيه شي صغير إلك وحدج</p><button class="reset" onclick="resetReveal()">اختاري قلب ثاني ✨</button></footer></main>
<script>
const messages=[
'تدرين شنو أحب بفكرة القمر؟ إن حتى لو بيناتنا مسافة، نكدر نطالع نفس السما وأتذكّرج وأبتسم. يا ريت هسه أگدر أشوف ضحكتج قدامي 🤍',
'يا بسبوستي، إنتِ مو مجرد شخص أحچي وياه، إنتِ إنسانة إلها مكان خاص بقلبي. أحب سوالفج ودلعج وحتى أبسط تفاصيلج، وأتمنى دوم أكون سبب بضحكتج وراحتج 💌',
'عندي طلب صغير 🙈 سجّليلي ريكورد واحچيلي أي سالفة من يومج، حتى لو سالفة تافهة… أحب أسمع صوتج وأحسج قريبة مني 🎧',
'أمنيتي إلنا مو شي كبير: يوم نلتقي، أمسك إيدج ونتمشى سوا بدون استعجال، ونحچي ونضحك ونعيش لحظة تمنّيناها هواي 🌷',
'التحدي مالج: كمّلي هالجملة بصوتج وبكل دلع: «سيف حبيبي، أكثر شي أحبه بيك هو…» 😳💗',
'المفاجأة الحقيقية مو بالموقع ولا بالكلام المكتوب… المفاجأة إن أكو واحد اسمه سيف، كل ما يفكر بيج يتمنى لو يگدر يختصر المسافة كلها بحضن واحد، ويگولج: إنتِ غالية عليّ هواي يا لين. أحبج ❤️'
];
function reveal(i){const box=document.getElementById('reveal');box.innerHTML='<div style="font-size:30px;margin-bottom:8px">💗✨💗</div>'+messages[i];box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'nearest'});}function resetReveal(){const box=document.getElementById('reveal');box.classList.remove('show');box.innerHTML='';document.querySelector('.hero').scrollIntoView({behavior:'smooth'});}
</script></body></html>
